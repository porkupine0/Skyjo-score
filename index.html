<title>Skyjo Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#eef3f1; --surface:#ffffff; --surface-2:#e3ebe8; --ink:#17262f; --muted:#5b6c72; --line:#cfdad6;
  --navy:#2b4c8c; --sky:#5fb4d9; --green:#3c9a5b; --yellow:#e0ac1c; --red:#d4473a;
  --accent:#2b4c8c; --accent-ink:#ffffff; --lead:#e7f4ea; --lead-line:#3c9a5b; --warn-bg:#fdecea;
  --shadow:0 1px 2px rgba(23,38,47,.06),0 6px 18px rgba(23,38,47,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1a1f; --surface:#17252c; --surface-2:#1f3039; --ink:#e7eff0; --muted:#94a8ad; --line:#2c3f47;
  --navy:#7c9ee3; --sky:#79c6e6; --green:#5cc07c; --yellow:#f0c24a; --red:#ef7266;
  --accent:#7c9ee3; --accent-ink:#0f1a1f; --lead:#173327; --lead-line:#5cc07c; --warn-bg:#3a1f1c;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1a1f; --surface:#17252c; --surface-2:#1f3039; --ink:#e7eff0; --muted:#94a8ad; --line:#2c3f47;
  --navy:#7c9ee3; --sky:#79c6e6; --green:#5cc07c; --yellow:#f0c24a; --red:#ef7266;
  --accent:#7c9ee3; --accent-ink:#0f1a1f; --lead:#173327; --lead-line:#5cc07c; --warn-bg:#3a1f1c;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stripe{display:flex;gap:3px;margin-top:6px}
.stripe i{width:14px;height:20px;border-radius:3px;display:block}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--red);border-color:var(--red)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:46px;height:46px;font-size:22px;padding:0}
.stepper .count{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;font-weight:800;min-width:40px;text-align:center}
.hint{font-size:14px;color:var(--muted);margin:0}

/* standings */
.players{display:flex;flex-direction:column;gap:8px}
.player{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.player.lead{background:var(--lead);border-color:var(--lead-line)}
.rank{font-weight:700;color:var(--muted);text-align:center}
.player.lead .rank{color:var(--green)}
.pname{font-weight:700;overflow-wrap:anywhere}
.total{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800;text-align:right}
.bar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;border-radius:3px}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--green);color:var(--surface);margin-left:6px;vertical-align:2px}

/* entry */
.entry{display:flex;flex-direction:column;gap:10px}
.erow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow:last-child{border-bottom:0}
.erow .who{font-weight:700;overflow-wrap:anywhere}
.erow .note{font-size:13px;color:var(--red);font-weight:700;grid-column:1 / 4}
.scorebox{display:flex;align-items:center;gap:4px}
.scorebox button{width:40px;height:44px;padding:0;font-size:18px}
.scorebox input{width:64px;text-align:center;font-size:20px;font-weight:700;padding:8px 4px}
.scorebox button.neg{background:var(--navy);color:var(--accent-ink);border-color:var(--navy)}
.outbtn{font-size:13px;padding:8px 10px;white-space:nowrap}
.outbtn[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#17262f}
.err{background:var(--warn-bg);color:var(--red);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}

/* history */
.tablewrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
th:first-child,td:first-child{text-align:left}
td.rd button{padding:4px 10px;font-size:14px}
td .dbl{color:var(--red);font-weight:700}
td .out{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:5px;vertical-align:1px}
tfoot td{font-weight:800;border-bottom:0}
.legend{font-size:13px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}

/* how to play */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.guide h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:16px;font-weight:800;color:var(--accent);margin:0}
.guide section{display:flex;flex-direction:column;gap:6px}
.guide p,.guide li{font-size:15px;line-height:1.55;max-width:65ch}
.guide p{margin:0}
.guide ul,.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.example{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}

.banner{background:var(--green);color:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.banner h2{font-size:26px;font-weight:800}
.banner button{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
@media (prefers-reduced-motion:no-preference){.bar span{transition:width .4s ease}}

/* stats */
.hl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aw{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:2px}
.aw .an{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:800}
.aw .ah{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;overflow-wrap:anywhere}
.aw .ad{font-size:13px;color:var(--muted)}
.stwrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}

</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>

<div class="wrap" id="app"></div>

<script>
const LIMIT = 100;
const KEY = "skyjo-scorekeeper-v1";
let state = load() || { phase:"setup", count:4, names:["","","","","","","",""], players:[], rounds:[], limit:LIMIT, tab:"game" };
if (!state.tab) state.tab = "game";
let entry = null; // {editing:index|null, raw:[strings], out:index|null, error:""}
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Skyjo rule: whoever goes out doubles their round score if it isn't strictly the lowest (and is positive).
function scoreRound(r){
  const final = r.raw.slice(); let doubled = false;
  if (r.out != null){
    const mine = r.raw[r.out];
    const strictlyLowest = r.raw.every((v,i) => i === r.out || mine < v);
    if (!strictlyLowest && mine > 0){ final[r.out] = mine * 2; doubled = true; }
  }
  return { final, doubled };
}
function totals(){
  const t = state.players.map(() => 0);
  state.rounds.forEach(r => scoreRound(r).final.forEach((v,i) => t[i] += v));
  return t;
}
function gameOver(){ return state.rounds.length > 0 && totals().some(v => v >= state.limit); }

function bandColor(total){
  const p = total / state.limit;
  if (p < .4) return "var(--green)";
  if (p < .7) return "var(--yellow)";
  return "var(--red)";
}

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(() => { confirmKey = null; render(); }, 3500);
}

// Keep the screen on while a game is being played.
let wakeLock = null, wakePending = false;
async function keepAwake(){
  const want = state.phase === "play" && document.visibilityState === "visible";
  try{
    if (want && !wakeLock && !wakePending && navigator.wakeLock){
      wakePending = true;
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  }catch(e){ wakeLock = null; }
  wakePending = false;
}
document.addEventListener("visibilitychange", keepAwake);

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  app.innerHTML = state.tab === "guide" ? header() + guideView() : state.phase === "setup" ? setupView() : playView();
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus(); }
  keepAwake();
}

function header(extra=""){
  return `<div class="brand"><div><h1>Skyjo</h1>
    <div class="stripe" aria-hidden="true"><i style="background:var(--navy)"></i><i style="background:var(--sky)"></i><i style="background:var(--green)"></i><i style="background:var(--yellow)"></i><i style="background:var(--red)"></i></div></div><div class="hx-hbtns">${hx.button()}${extra}</div></div>
  <div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-game" data-act="tab" data-v="game" aria-selected="${state.tab==="game"}">Game</button><button class="tab" role="tab" id="tab-guide" data-act="tab" data-v="guide" aria-selected="${state.tab==="guide"}">How to play</button></div>`;
}

function guideView(){
  return `<div class="panel guide">
    <section><h2>The idea</h2><p>In Skyjo, low is good. Everyone has a grid of 12 face-down cards. Swap in low cards, turn your cards over, and try to finish each round with the lowest total. When anyone reaches ${state.limit}, the lowest score wins.</p></section>
    <section><h3>What you need</h3><ul><li>2 to 8 players.</li><li>A Skyjo deck: 150 cards numbered from −2 to 12.</li></ul></section>
    <section><h3>1. Setup</h3>
      <ul><li>Deal 12 cards face down to each player. Without looking, lay them out in a grid of 3 rows and 4 columns.</li>
      <li>The rest of the deck is the draw pile. Turn its top card face up to start the discard pile.</li>
      <li>Everyone turns 2 of their cards face up. Whoever shows the highest total goes first. In later rounds, whoever ended the last round goes first.</li></ul></section>
    <section><h3>2. Your turn</h3>
      <p>Play goes to the left. On your turn, do one of these:</p>
      <ul><li>Take the top card of the discard pile and swap it with any card in your grid. The card you replace goes face up on the discard pile.</li>
      <li>Draw from the draw pile. Then either swap it with any card in your grid, or discard it and turn one of your face-down cards face up.</li></ul></section>
    <section><h3>3. Clearing a column</h3><p>When a column shows three face-up cards of the same number, discard the whole column. Those cards don't count anymore, even if they were three 12s.</p></section>
    <section><h3>4. Ending a round</h3><p>When someone has turned over all their cards, everyone else gets one more turn. Then turn over any face-down cards and add up each grid. Negative cards subtract.</p></section>
    <section><h3>5. Scoring</h3>
      <p>Each player scores the total of their grid. But the player who ended the round has to be strictly the lowest. If anyone else ties or beats them, their score is doubled. That only applies to a score above 0.</p>
      <div class="example"><span><b>Example:</b> Max turns over his last card with a total of 14. Lena has 9.</span><span>Max isn't the lowest, so his 14 doubles to 28.</span></div></section>
    <section><h3>6. Winning</h3><p>The game ends after the round in which anyone reaches ${state.limit}. The lowest total wins.</p></section>
    <section><h3>Strategy tips</h3>
      <ul><li>Get rid of 9s through 12s early.</li>
      <li>Collect matching numbers in a column. Three of a kind wipes them out.</li>
      <li>Don't end a round unless you're sure you're the lowest. A doubled score hurts.</li>
      <li>Watch what you discard. It might be just what the next player needs for a column.</li>
      <li>When someone is about to finish, replace face-down cards with known low cards. A card you haven't seen could be a 12.</li></ul></section>
    <section><h3>Using this app</h3>
      <ol><li>Pick 2 to 8 players and enter their names.</li>
      <li>After each round, tap Enter round scores. Type each player's total, and tap ± for a negative score.</li>
      <li>Tap Went out for whoever turned over all their cards first. The app doubles their score when the rule applies.</li>
      <li>Tap a round number in the table to fix a mistake.</li></ol></section>
    <section><h3>Glossary</h3>
      <ul><li><b>Grid:</b> your 12 cards, 3 rows by 4 columns.</li>
      <li><b>Going out:</b> turning over your last face-down card, which ends the round.</li>
      <li><b>Doubling:</b> the penalty for going out without the lowest score.</li></ul></section>
  </div>`;
}

function setupView(){
  let names = "";
  for (let i=0;i<state.count;i++){
    names += `<div class="row"><span class="eyebrow num" style="width:22px">${i+1}</span>
      <input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(state.names[i]||"")}" maxlength="18" autocomplete="off"></div>`;
  }
  return header() + `
  <div class="panel">
    <div><div class="eyebrow">Players</div></div>
    <div class="stepper">
      <button id="minus" data-act="count" data-d="-1" aria-label="Fewer players" ${state.count<=2?"disabled":""}>−</button>
      <span class="count num">${state.count}</span>
      <button id="plus" data-act="count" data-d="1" aria-label="More players" ${state.count>=8?"disabled":""}>+</button>
      <p class="hint grow">Skyjo plays 2 to 8.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">${names}</div>
    <button class="primary" data-act="start" id="start">Start game</button>
  </div>
  <p class="hint">First to ${state.limit} ends the game. Lowest total wins. If the player who goes out isn't strictly lowest for the round, their positive score is doubled automatically.</p>`;
}

function playView(){
  const t = totals(), over = gameOver();
  const min = Math.min(...t);
  const order = t.map((v,i)=>i).sort((a,b)=>t[a]-t[b]);
  const rankOf = {}; order.forEach((idx,pos)=>{ rankOf[idx] = pos===0 || t[idx]!==t[order[pos-1]] ? pos+1 : rankOf[order[pos-1]]; });
  const hasScores = state.rounds.length > 0;

  let banner = "";
  if (over){
    const winners = state.players.filter((_,i)=>t[i]===min);
    banner = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · round ${state.rounds.length}</div>
      <h2>${esc(winners.join(" & "))} win${winners.length>1?"":"s"} with ${min}</h2>
      ${hx.saved()}
      <div class="btnrow"><button data-act="rematch" id="rematch">Rematch, same players</button><button data-act="newsetup" id="newsetup2">New players</button></div></div>`;
  }

  const players = order.map(i => {
    const lead = hasScores && t[i]===min;
    const w = Math.max(0, Math.min(100, t[i]/state.limit*100));
    return `<div class="player ${lead?"lead":""}">
      <span class="rank num">${hasScores?rankOf[i]:"–"}</span>
      <span class="pname">${esc(state.players[i])}${lead && !over?`<span class="tag">Leading</span>`:""}</span>
      <span class="total num">${t[i]}</span>
      <div class="bar" aria-hidden="true"><span style="width:${w}%;background:${bandColor(t[i])}"></span></div>
    </div>`;
  }).join("");

  const nextRound = state.rounds.length + 1;
  let entryHtml;
  if (entry){
    const n = entry.editing != null ? entry.editing + 1 : nextRound;
    const parsed = entry.raw.map(v => /^-?\d+$/.test(String(v).trim()) ? parseInt(v,10) : null);
    let preview = null;
    if (entry.out != null && parsed.every(v => v !== null)) preview = scoreRound({raw:parsed,out:entry.out});
    const rows = state.players.map((p,i) => {
      const neg = String(entry.raw[i]).trim().startsWith("-");
      const note = `<div class="note" id="note-${i}" ${preview && preview.doubled && i===entry.out ? "" : "hidden"}>${preview && preview.doubled && i===entry.out ? `Not strictly lowest: ${parsed[i]} doubles to ${preview.final[i]}` : ""}</div>`;
      return `<div class="erow"><span class="who">${esc(p)}</span>
        <span class="scorebox"><button class="${neg?"neg":""}" data-act="sign" data-i="${i}" id="sign-${i}" aria-label="Make ${esc(p)}'s score negative or positive">±</button>
        <input type="text" inputmode="numeric" pattern="-?[0-9]*" id="score-${i}" data-score="${i}" value="${esc(entry.raw[i])}" aria-label="${esc(p)} round score" autocomplete="off"></span>
        <button class="outbtn" data-act="out" data-i="${i}" id="out-${i}" aria-pressed="${entry.out===i}">Went out</button>${note}</div>`;
    }).join("");
    entryHtml = `<div class="panel entry">
      <div class="row"><h2 class="grow">${entry.editing!=null?"Edit round":"Round"} ${n}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
      <p class="hint">Enter each player's card total. Tap <b>Went out</b> for whoever flipped their last card first.</p>
      <div>${rows}</div>
      ${entry.error?`<div class="err">${esc(entry.error)}</div>`:""}
      <button class="primary" data-act="saveRound" id="saveRound">${entry.editing!=null?"Save changes":"Add round "+n}</button>
      ${entry.editing!=null?`<button class="danger" data-act="delRound" id="delRound">${confirmKey==="del"?"Tap again to delete round "+n:"Delete this round"}</button>`:""}
    </div>`;
  } else if (!over){
    entryHtml = `<button class="primary" data-act="newRound" id="newRound">Enter round ${nextRound} scores</button>`;
  } else entryHtml = "";

  let history = "";
  if (hasScores){
    const head = `<tr><th>Rd</th>${state.players.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>`;
    const body = state.rounds.map((r,ri) => {
      const s = scoreRound(r);
      return `<tr><td class="rd"><button id="edit-${ri}" data-act="edit" data-i="${ri}" aria-label="Edit round ${ri+1}">${ri+1}</button></td>${s.final.map((v,i)=>`<td>${r.out===i?'<span class="out" title="Went out"></span>':""}${s.doubled&&r.out===i?`<span class="dbl">${v}</span>`:v}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr><td>Total</td>${t.map(v=>`<td>${v}</td>`).join("")}</tr>`;
    history = `<div class="panel">
      <div class="row"><h2 class="grow">Rounds</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>
      <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
      <div class="legend"><span><span class="out" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-right:5px"></span>Went out</span><span><span style="color:var(--red);font-weight:700">Red</span> = doubled</span><span>Tap a round number to edit it</span></div>
    </div>`;
  }

  const reset = `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>`;
  return header(reset) + banner + `<div class="players">${players}</div>` + entryHtml + history + statsView() +
    `<p class="hint">Game ends when anyone reaches ${state.limit}. Every game is saved in History on this device. Tap History to see past games. The screen stays on while you play.</p>`;
}

function openEntry(editIdx){
  if (editIdx != null){
    const r = state.rounds[editIdx];
    entry = { editing:editIdx, raw:r.raw.map(String), out:r.out, error:"" };
  } else entry = { editing:null, raw:state.players.map(()=> ""), out:null, error:"" };
  render();
  const f = document.getElementById("score-0"); if (f) f.focus();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null;
  switch(act){
    case "count": state.count = Math.min(8, Math.max(2, state.count + +b.dataset.d)); save(); render(); break;
    case "tab": state.tab = b.dataset.v; save(); render(); window.scrollTo(0,0); break;
    case "start":
      state.players = Array.from({length:state.count}, (_,k)=> (state.names[k]||"").trim() || `Player ${k+1}`);
      state.rounds = []; state.phase = "play"; entry = null; save(); render(); break;
    case "newRound": openEntry(null); break;
    case "edit": openEntry(i); break;
    case "cancel": entry = null; render(); break;
    case "out": entry.out = entry.out === i ? null : i; entry.error=""; render(); break;
    case "sign": {
      let v = String(entry.raw[i]).trim();
      entry.raw[i] = v.startsWith("-") ? v.slice(1) : "-" + v;
      render(); const f = document.getElementById("score-"+i); if (f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); }
      break;
    }
    case "saveRound": {
      const vals = entry.raw.map(v => String(v).trim());
      const bad = vals.findIndex(v => !/^-?\d+$/.test(v));
      if (bad >= 0){ entry.error = `Enter a whole number for ${state.players[bad]}.`; render(); break; }
      if (entry.out == null){ entry.error = "Tap Went out for the player who ended the round."; render(); break; }
      const r = { raw: vals.map(v=>parseInt(v,10)), out: entry.out };
      if (entry.editing != null) state.rounds[entry.editing] = r; else state.rounds.push(r);
      entry = null; save(); render(); break;
    }
    case "delRound": confirmThen("del", () => { state.rounds.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", () => { state.rounds.pop(); entry = null; save(); render(); }); break;
    case "rematch": state.rounds = []; entry = null; save(); render(); break;
    case "newsetup": state.phase = "setup"; state.rounds = []; entry = null; save(); render(); break;
    case "newgame": confirmThen("new", () => { state.phase = "setup"; state.rounds = []; entry = null; save(); render(); }); break;
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.name != null){ state.names[+t.dataset.name] = t.value; save(); }
  if (t.dataset.score != null && entry){
    entry.raw[+t.dataset.score] = t.value.replace(/[^\d-]/g,"").replace(/(?!^)-/g,"");
    if (t.value !== entry.raw[+t.dataset.score]) t.value = entry.raw[+t.dataset.score];
    entry.error = "";
    updateNotes();
  }
});
function updateNotes(){
  if (!entry) return;
  const parsed = entry.raw.map(v => /^-?\d+$/.test(String(v).trim()) ? parseInt(v,10) : null);
  const ok = entry.out != null && parsed.every(v => v !== null);
  const s = ok ? scoreRound({raw:parsed,out:entry.out}) : null;
  state.players.forEach((_,i) => {
    const n = document.getElementById("note-"+i); if (!n) return;
    const show = s && s.doubled && i === entry.out;
    n.hidden = !show;
    n.textContent = show ? `Not strictly lowest: ${parsed[i]} doubles to ${s.final[i]}` : "";
    const sb = document.getElementById("sign-"+i);
    if (sb) sb.classList.toggle("neg", String(entry.raw[i]).trim().startsWith("-"));
  });
  const err = document.querySelector(".err"); if (err) err.remove();
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.score != null){
    e.preventDefault();
    const nx = document.getElementById("score-" + (+e.target.dataset.score + 1));
    if (nx) nx.focus(); else e.target.blur();
  }
});

function topOf(arr){ const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; }
function awCard(title, who, detail){ return `<div class="aw"><span class="an">${title}</span><span class="ah">${who}</span><span class="ad">${detail}</span></div>`; }
function statTable(head, rows){ return `<div class="stwrap"><table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`; }
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;

function statsView(){
  const R = state.rounds, n = R.length; if (!n) return "";
  const P = state.players, np = P.length;
  const won = Array(np).fill(0), outs = Array(np).fill(0), dbl = Array(np).fill(0), best = Array(np).fill(Infinity), worst = Array(np).fill(-Infinity), tot = Array(np).fill(0);
  let low = {v:Infinity, list:[]};
  R.forEach((r,ri) => { const s = scoreRound(r), m = Math.min(...s.final);
    if (r.out != null) outs[r.out]++; if (s.doubled) dbl[r.out]++;
    s.final.forEach((v,i) => { if (v===m) won[i]++; best[i] = Math.min(best[i],v); worst[i] = Math.max(worst[i],v); tot[i]+=v;
      if (v < low.v) low = {v, list:[[i,ri]]}; else if (v === low.v) low.list.push([i,ri]); }); });

// History adapter: how a Skyjo game looks to the shared history module.
// A round's scores come from the app's scoreRound(), so the doubled score of a player who went out without being
// strictly lowest is already in them; the app's totals() is the plain sum of those, so no totals override is needed.
const HX = {
  app: "skyjo", title: "Skyjo", unit: ["round", "rounds"], sideWord: "player", lowWins: true,
  guest: n => /^player \d+$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !Array.isArray(state.rounds) || !state.rounds.length) return null;
    const P = state.players.map((_,i) => i), S = state.rounds.map(scoreRound), t = totals(), done = gameOver(), min = Math.min(...t);
    return {
      sides: state.players.map(p => ({ name: String(p), players: [String(p)] })),
      rounds: S.map(s => P.map(i => s.final[i])),
      done, winners: done ? P.filter(i => t[i] === min) : undefined,
      labels: S.map((s,k) => s.doubled ? `${k+1} · ×2` : String(k+1)),
      extra: { out: state.rounds.map(r => r.out != null ? r.out : null), dbl: S.map(s => s.doubled) }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.out)) return "";
    const nm = i => esc(g.sides[i] ? g.sides[i].name : `Player ${i+1}`);
    const line = (o,k) => o == null || !g.sides[o] ? `Round ${k+1}: nobody went out`
      : `Round ${k+1}: ${nm(o)} went out${x.dbl && x.dbl[k] ? `, doubled from ${g.rounds[k][o] / 2} to ${g.rounds[k][o]}` : ""}`;
    return `<p class="hint">${x.out.map(line).join(" · ")}</p>`;
  },
  records(done){
    const out = [], rows = [], dbl = new Map();
    done.forEach(g => {
      g.sides.forEach((s,i) => g.rounds.forEach(r => rows.push({ g, who: s.name, v: r[i] })));
      const x = g.extra; if (!x || !Array.isArray(x.out) || !Array.isArray(x.dbl)) return;
      x.out.forEach((o,k) => {
        if (!x.dbl[k] || !g.sides[o]) return;
        const nm = String(g.sides[o].name).trim(); if (HX.guest(nm)) return;
        const key = nm.replace(/\s+/g, " ").toLowerCase(), r = dbl.get(key) || { name: nm, n: 0 };
        r.n++; dbl.set(key, r);

    });
    const names = w => [...new Set(w)].slice(0,3).join(", ");
    const when = w => w.length === 1 ? new Date(w[0].g.date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${w.length} times`;
    if (rows.length){
      const m = Math.min(...rows.map(r => r.v)), w = rows.filter(r => r.v === m);
      out.push(["Best round", names(w.map(r => r.who)), `${m < 0 ? "−" : ""}${Math.abs(m)} · ${when(w)}`]);
    }
    if (dbl.size){
      const all = [...dbl.values()], m = Math.max(...all.map(r => r.n));
      out.push(["Most times doubled", names(all.filter(r => r.n === m).map(r => r.name)), `${m} time${m === 1 ? "" : "s"}`]);
    }

  }

/* ---------- game history (shared module, same in every score app) ----------

   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows

   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */

  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";

  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));

    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;

    if (has) {

        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined

  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));

    if (ui.range === "all") return true;

  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;

  }

      <p class="hint">To combine two phones' history, share the backup to the other phone and tap Restore there. Games it already has are skipped.</p>
      <div class="btnrow"><button type="button" data-hx="share" id="hx-share" ${games.length ? "" : "disabled"}>Share backup</button><button type="button" data-hx="download" id="hx-download" ${games.length ? "" : "disabled"}>Download</button><button type="button" data-hx="restore" id="hx-restore">Restore</button></div>
      <input type="file" id="hx-file" accept=".json,application/json" hidden>

    const list = byDate().filter(inRange), stats = career(list), done = list.filter(isDone);
    const sel = ui.sel && stats.players.find(p => p.k === ui.sel);
    const years = [...new Set(games.map(g => new Date(g.date).getFullYear()).filter(y => !isNaN(y)))].sort((a, b) => b - a);
    const opt = (v, l) => `<option value="${v}" ${ui.range === v ? "selected" : ""}>${l}</option>`;
    const range = `<div class="row"><label class="eyebrow" for="hx-range">Showing</label><select id="hx-range" class="grow">${opt("all", "All time")}${opt("d30", "Last 30 days")}${opt("d90", "Last 90 days")}${years.map(y => opt("y" + y, y)).join("")}</select></div>`;

    let body;
    if (sel) {
      body = `<div class="panel"><div class="row"><h2 class="grow">${e(sel.name)}</h2><button class="small" type="button" data-hx="player" data-k="" id="hx-everyone">Everyone</button></div>
        <div class="hx-awards">${award("Games", sel.gp, `in ${rangeLabel()}`)}${award("Wins", sel.wins, `${pct(sel.wins, sel.gp)} of games${sel.shared ? `, ${sel.shared} shared` : ""}`)}${award(done.every(g => g.lowWins) ? "Best (lowest)" : "Best score", sel.best == null ? "–" : num(sel.best), "single game")}${award("Average", avg(sel.sum, sel.gp), "per game")}${award("Best streak", sel.bestStreak, "wins in a row")}</div></div>`;
    } else if (!done.length) {
      body = `<div class="panel"><h2>All-time records</h2><p class="hint">No finished games in ${rangeLabel()} yet. Unfinished games are listed below.</p></div>`;
    } else {
      const pl = stats.players, tm = stats.teams;
      body = `<div class="panel"><div><h2>Players</h2><p class="hint">${plural(done.length, "finished game")} in ${rangeLabel()}. Tap a name for their record and games.</p></div>
        ${pl.length ? `<div class="stwrap"><table class="st"><thead><tr><th>Player</th><th>GP</th><th>Wins</th><th>Win %</th><th>Avg</th><th>Best</th></tr></thead><tbody>
          ${pl.map(p => `<tr><td><button class="hx-link" type="button" data-hx="player" data-k="${e(p.k)}">${e(p.name)}</button></td><td>${p.gp}</td><td>${p.wins}</td><td>${pct(p.wins, p.gp)}</td><td>${avg(p.sum, p.gp)}</td><td>${p.best == null ? "–" : num(p.best)}</td></tr>`).join("")}
        </tbody></table></div><p class="hint">GP: games played. Wins include ties. Avg and Best are ${HX.sideWord === "player" ? "the player's" : "the team's"} final score.</p>`
        : `<p class="hint">Only unnamed players so far. Name everyone at the start of a game to track them here.</p>`}</div>
        ${tm.length ? `<div class="panel"><h2>Partnerships</h2><div class="stwrap"><table class="st"><thead><tr><th>Pair</th><th>GP</th><th>Wins</th><th>Win %</th></tr></thead><tbody>${tm.map(r => `<tr><td>${e(r.names.join(" & "))}</td><td>${r.gp}</td><td>${r.wins}</td><td>${pct(r.wins, r.gp)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
        ${recordsView(done, stats)}`;
    }
    return `<div class="hx">${top}${nudge}${range}${body}${logView(list, sel)}${backupView()}${moveView()}</div>`;
  }

  // ----- backup -----
  function file() {
    const data = JSON.stringify({ app: HX.app, version: 1, exported: new Date().toISOString(), games }, null, 2);
    return new File([data], `${HX.app}-history-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
  }
  function marked() { try { localStorage.setItem(BKEY, String(games.filter(isDone).length)); } catch (err) { /* ignore */ } }
  function download() {
    const f = file(), a = document.createElement("a");
    a.href = URL.createObjectURL(f); a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    marked(); ui.msg = `Downloaded ${f.name}.`;
  }
  async function share() {
    const f = file();
    if (navigator.canShare && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f], title: `${HX.title} history` }); marked(); ui.msg = "Backup shared."; }
      catch (err) { if (err.name !== "AbortError") ui.msg = "Couldn't share. Try Download instead."; }
    } else { download(); ui.msg += " This browser can't share files, so it was downloaded instead."; }
  }
  function restore(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    if (data && data.kind === BUNDLE && data.apps) data = Array.isArray(data.apps[HX.app]) ? data.apps[HX.app] : [];
    const list = Array.isArray(data) ? data : data && Array.isArray(data.games) && (!data.app || data.app === HX.app) ? data.games : null;
    if (!list) { ui.msg = `That file isn't a ${HX.title} backup.`; return; }
    ui.msg = merge(list);
  }
  // Adds games this phone doesn't have; a game it has is replaced only by a more complete copy (never the one being played).
  function merge(list) {
    let added = 0, updated = 0, skipped = 0, bad = 0;
    list.forEach(g => {
      if (!valid(g)) { bad++; return; }
      const k = games.findIndex(x => x.id === g.id);
      const copy = JSON.parse(JSON.stringify(g));
      if (isNaN(new Date(copy.date))) copy.date = new Date().toISOString();
      if (k < 0) { games.push(copy); added++; }
      else if (g.id !== state.hxId && (g.done && !games[k].done || g.rounds.length > games[k].rounds.length)) { games[k] = copy; updated++; }
      else skipped++;
    });
    persist();
    return `Added ${plural(added, "game")}.` + (updated ? ` Updated ${updated}.` : "") + (skipped ? ` ${skipped} already here.` : "") + (bad ? ` ${bad} unreadable.` : "");
  }

  // ----- moving History into a Home Screen icon -----
  // On iPhone an app opened from a Home Screen icon keeps its own storage, separate from Safari. All the card apps
  // share Safari's storage, so one Copy there carries every card game's history; Paste in an icon takes this game's part.
  const BUNDLE = "card-games-history";
  const CARD_APPS = ["hand-foot", "hearts", "skyjo", "cribbage", "spades", "euchre", "pitch", "casino", "flip7", "up-down-river", "presidents", "mao", "card-golf"];
  const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  const standalone = () => navigator.standalone === true || !!(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
  const here = () => (location.host + location.pathname).replace(/index\.html$/, "");
  function bundle() {
    const apps = {}; let n = 0, k = 0;
    CARD_APPS.forEach(id => {
      let a = [];
      try { a = JSON.parse(localStorage.getItem(id + "-history-v1") || "[]"); } catch (err) { a = []; }
      if (Array.isArray(a) && a.length) { apps[id] = a; n += a.length; k++; }
    });
    return { text: JSON.stringify({ kind: BUNDLE, version: 1, exported: new Date().toISOString(), apps }), games: n, apps: k };
  }
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (err) { /* older browsers: copy from a hidden box */ }
    const t = document.createElement("textarea");
    t.value = text; t.setAttribute("readonly", ""); t.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(t); t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    t.remove();
    return ok;
  }
  async function copyAll() {
    const b = bundle(), app = standalone();
    if (!b.games) { ui.mmsg = app ? "There are no games in this app's History yet." : "No card game History is saved in Safari on this phone. If you play from a game's own Home Screen icon, its History is in that icon: open it, tap History, then Copy History."; return; }
    ui.mmsg = await copyText(b.text)
      ? app ? `Copied ${plural(b.games, "game")}. Now open Card Night or the other Home Screen icon and tap Paste History.`
        : `Copied ${plural(b.games, "game")} from ${plural(b.apps, "card app")}. Now open the Home Screen icon or Card Night and tap Paste History.`
      : "Couldn't copy on this browser. Use Share backup instead, then Restore in the other app.";
  }
  async function pasteFromSafari() {
    let text = "";
    try { text = await navigator.clipboard.readText(); } catch (err) { text = ""; }
    if (!text) { ui.pasteBox = true; ui.mmsg = "Long-press the box, tap Paste, then tap Add games."; return; }
    take(text);
  }
  function take(text) {
    let data = null;
    try { data = JSON.parse(text); } catch (err) { data = null; }
    if (data && data.kind === BUNDLE && data.apps && typeof data.apps === "object") {
      const list = data.apps[HX.app];
      ui.pasteBox = false;
      ui.mmsg = Array.isArray(list) && list.length ? merge(list) : `What you copied has no ${HX.title} games.`;
    } else if (data && (data.app === HX.app || Array.isArray(data)) && (Array.isArray(data) || Array.isArray(data.games))) {
      ui.pasteBox = false; ui.mmsg = merge(Array.isArray(data) ? data : data.games);
    } else ui.mmsg = "That isn't card game history. Copy it first: in Safari, History → Copy for Home Screen; in another Home Screen icon, History → Copy History.";
  }
  function moveView() {
    if (!iOS) return "";
    const msg = ui.mmsg ? `<p class="hint" role="status">${e(ui.mmsg)}</p>` : "";
    if (!standalone()) return `<div class="panel"><h2>Home Screen icon</h2>
      <p class="hint">An app opened from a Home Screen icon keeps its own History, separate from Safari. To bring your games over, tap Copy here, then open the Home Screen icon or Card Night and tap Paste History. One Copy carries every card game's history.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy for Home Screen</button></div>${msg}</div>`;
    return `<div class="panel"><h2>Move History</h2>
      <p class="hint">This Home Screen app keeps its own History, separate from Safari and from other Home Screen icons.</p>
      <p class="hint">To move these games into Card Night or another icon, tap Copy History, then open it there and tap Paste History.</p>
      <p class="hint">To bring in games you played in Safari, open ${e(here())} in Safari, tap History, then Copy for Home Screen. Then come back here and tap Paste History.</p>
      <div class="btnrow"><button type="button" data-hx="mcopy" id="hx-mcopy">Copy History</button><button type="button" data-hx="mpaste" id="hx-mpaste">Paste History</button></div>
      ${ui.pasteBox ? `<textarea id="hx-mtext" class="hx-paste" rows="3" placeholder="Long-press here and tap Paste" aria-label="Copied history"></textarea><div class="btnrow"><button type="button" data-hx="mpaste2" id="hx-mpaste2">Add games</button></div>` : ""}${msg}</div>`;
  }

  // ----- sharing a result as text (group chats) -----
  function resultText(g) {
    const t = totalsOf(g), w = g.done ? winnersOf(g) : [];
    const better = (a, b) => g.lowWins ? a < b : a > b;
    const order = t.map((_, i) => i).sort((a, b) => (g.lowWins ? t[a] - t[b] : t[b] - t[a]) || a - b);
    const rest = order.filter(i => !w.includes(i));
    const lines = [`${HX.title} · ${dayTxt(g.date)}`];
    if (!g.done) lines.push(`Standings after ${plural(g.rounds.length, unitOne, unitMany)}`);
    order.filter(i => w.includes(i)).forEach(i => lines.push(`🏆 ${sideLabel(g.sides[i])} ${num(t[i])}`));
    rest.forEach(i => {
      const pos = w.length + 1 + rest.filter(j => better(t[j], t[i])).length, tied = rest.some(j => j !== i && t[j] === t[i]);
      lines.push(`${tied ? "T" : ""}${pos}. ${sideLabel(g.sides[i])} ${num(t[i])}`);
    });
    const foot = [g.done ? plural(g.rounds.length, unitOne, unitMany) : "", g.note || ""].filter(Boolean).join(" · ");
    if (foot) lines.push(foot);
    const solo = w.length === 1 && g.sides[w[0]].players.length === 1 ? g.sides[w[0]].players[0] : "";
    if (solo && !guest(solo)) {
      const p = career(byDate().filter(x => String(x.date) <= String(g.date))).players.find(x => x.k === pkey(solo));
      if (p && p.streak >= 2) lines.push(`🔥 ${p.name} has won ${p.streak} in a row`);
    }
    return lines.join("\n");
  }
  async function shareResult(id) {
    const g = games.find(x => x.id === id); if (!g) return;
    const text = resultText(g);
    if (navigator.share) {
      try { await navigator.share({ text }); return; } catch (err) { if (err.name === "AbortError") return; }
    }
    if (!(await copyText(text))) return;
    ui.copied = id; render();
    setTimeout(() => { if (ui.copied === id) { ui.copied = null; render(); } }, 3000);
  }
  function shareButton(label, cls) {
    const id = state.hxId;
    if (!id || !games.some(g => g.id === id)) return "";
    return `<button class="${cls || "small"}" type="button" data-hx="sres" data-id="${e(id)}" id="hx-sres">${ui.copied === id ? "Copied ✓" : e(label || "Share result")}</button>`;
  }
  function saved() { return `<div class="hx-saved"><span style="opacity:.9">This game is saved in History.</span>${shareButton()}</div>`; }

  // ----- events -----
  function confirmThen(key, fn) {
    if (ui.confirm === key) { clearTimeout(ui.timer); ui.confirm = null; fn(); return; }
    ui.confirm = key; render();
    clearTimeout(ui.timer);
    ui.timer = setTimeout(() => { ui.confirm = null; if (ui.open) render(); }, 3500);
  }
  document.addEventListener("click", ev => {
    const b = ev.target.closest("[data-hx]"); if (!b) return;
    const a = b.dataset.hx;
    if (a === "open") { ui.open = true; ui.msg = ""; render(); window.scrollTo(0, 0); }
    else if (a === "back") { ui.open = false; ui.sel = null; ui.game = null; render(); window.scrollTo(0, 0); }
    else if (a === "game") { ui.game = ui.game === b.dataset.id ? null : b.dataset.id; render(); }
    else if (a === "del") confirmThen("del-" + b.dataset.id, () => { games = games.filter(g => g.id !== b.dataset.id); persist(); render(); });
    // an unfinished game that isn't being played (abandoned, or copied in from another phone or icon) can be closed out: best total wins
    else if (a === "fin") confirmThen("fin-" + b.dataset.id, () => {
      const g = games.find(x => x.id === b.dataset.id); if (!g || g.done || g.id === state.hxId) return;
      const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
      g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
      persist(); render();
    });
    else if (a === "all") { ui.all = !ui.all; render(); }
    else if (a === "player") { ui.sel = b.dataset.k || null; ui.all = false; render(); window.scrollTo(0, 0); }
    else if (a === "download") { download(); render(); }
    else if (a === "share") share().then(render);
    else if (a === "restore") { const f = document.getElementById("hx-file"); if (f) f.click(); }
    else if (a === "sres") shareResult(b.dataset.id);
    else if (a === "mcopy") copyAll().then(render);
    else if (a === "mpaste") pasteFromSafari().then(render);
    else if (a === "mpaste2") { const t = document.getElementById("hx-mtext"); take(t ? t.value : ""); render(); }
  });
  document.addEventListener("change", ev => {
    if (ev.target.id === "hx-range") { ui.range = ev.target.value; ui.sel = null; render(); }
    if (ev.target.id === "hx-file" && ev.target.files && ev.target.files[0]) ev.target.files[0].text().then(restore, () => { ui.msg = "Couldn't read that file."; }).then(render);
  });

  return { sync, view, button, note, saved, shareButton, isOpen: () => ui.open, games: () => games };
})();
// Wrap the app's own save() and render(): every save keeps the archive current, and History takes over the screen while open.
{
  const appSave = save, appRender = render;
  save = function () { hx.sync(); return appSave.apply(this, arguments); };
  render = function () {
    if (hx.isOpen()) { document.getElementById("app").innerHTML = hx.view(); return; }
    return appRender.apply(this, arguments);
  };
}
// A game already on this phone when History arrived is saved right away (dated now).
hx.sync(); save();
/* hx:js:end */
render();
</script>
